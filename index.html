<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101814"><title>あなただけの予想サイトを作ろう！</title>
<style>
:root{color-scheme:dark;--bg:#0c1410;--panel:#17221b;--line:#2d3c32;--muted:#a6b6aa;--accent:#b6f36b;--text:#f2f7f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{padding:18px 16px 12px;max-width:1120px;margin:auto}.brand{font-weight:850;font-size:20px;letter-spacing:.01em}.subtitle{font-size:12px;color:var(--muted);margin-top:5px}.supervision{font-size:12px;color:var(--accent);font-weight:700;margin-top:3px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:1120px;margin:0 auto;padding:0 16px 14px}
.menu button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:13px 12px;text-align:left;font:inherit;cursor:pointer;min-height:74px}
.menu button.active{border-color:var(--accent);background:#23341f;box-shadow:inset 0 0 0 1px #b6f36b55}
.menu strong{display:block;font-size:15px}.menu span{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.stage{height:calc(100dvh - 153px);min-height:480px;padding:0 8px 8px}iframe{width:100%;height:100%;border:0;border-radius:14px;background:#101814}
@media(min-width:760px){.top,.menu{padding-left:24px;padding-right:24px}.stage{padding:0 16px 16px;height:calc(100dvh - 153px)}.brand{font-size:23px}}
@media(max-width:420px){.brand{font-size:18px}.menu{gap:7px;padding-left:10px;padding-right:10px}.menu button{padding:11px 9px}.stage{padding:0 4px 4px;height:calc(100dvh - 151px)}}
</style></head><body>
<header class="top"><div class="brand">🐎 あなただけの予想サイトを作ろう！</div><div class="supervision">リメッシ先生監修</div><div class="subtitle">穴馬探しと馬場分析をひとつに。</div></header>
<nav class="menu" aria-label="メニュー">
<button type="button" class="active" data-view="horse"><strong>🎯 穴馬リスト</strong><span>狙いたい馬の登録・次走チェック・反省</span></button>
<button type="button" data-view="track"><strong>🏇 今日の馬場ラボ</strong><span>レース結果から脚質・コース取りを集計</span></button>
</nav>
<main class="stage"><iframe id="appFrame" title="競馬メモアプリ"></iframe></main>
<script>
const apps = {horse: "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#15251f\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"リメッシの狙いたい馬一覧🐎\">\n<title>リメッシの狙いたい馬一覧🐎</title>\n<style>\n:root{color-scheme:dark;--bg:#101814;--panel:#1a2720;--panel2:#223229;--line:#34463a;--text:#f3f6f2;--muted:#aebdb2;--accent:#b7e08a;--danger:#ff9b9b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,\"Hiragino Sans\",\"Noto Sans JP\",sans-serif;line-height:1.5}\nheader{padding:calc(18px + env(safe-area-inset-top)) 18px 16px;background:#15251f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}\nh1{font-size:21px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:12px}\nmain{max-width:760px;margin:auto;padding:16px 14px calc(34px + env(safe-area-inset-bottom))}\n.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:21px;color:var(--accent)}.stat span{font-size:11px;color:var(--muted)}\n.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:11px 8px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font-weight:650}.tab.active{background:var(--accent);color:#162219;border-color:var(--accent)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 12px}\nlabel{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,textarea,select{width:100%;font:inherit;color:var(--text);background:#111b15;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}textarea{min-height:78px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--accent)}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--panel2);color:var(--text);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#152219}.btn.danger{color:var(--danger)}.btn.small{font-size:12px;padding:7px 9px}\n.searchrow{display:flex;gap:8px;margin-bottom:10px}.searchrow input{flex:1;min-width:0}.searchrow select{width:125px}\n.horse{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.horse-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.horse h3{font-size:17px;margin:0 0 5px}.badge{display:inline-block;background:#304635;color:#d7f2bd;border-radius:999px;padding:3px 8px;font-size:11px;margin:0 4px 4px 0}.meta{font-size:12px;color:var(--muted);margin:7px 0}.memo{white-space:pre-wrap;font-size:13px;margin:8px 0 0;overflow-wrap:anywhere}.horse-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.history-head h4{margin:0;font-size:14px}.race-item{background:#111b15;border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:8px}.race-title{font-weight:700;font-size:13px}.race-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}.race-stat{font-size:11px;color:var(--muted)}.race-memo{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}.history-form{background:#111b15;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.history-form h4{margin:0 0 8px;font-size:14px}.history-form .grid{gap:0 8px}.history-empty{font-size:12px;color:var(--muted);padding:8px 0}.tiny{font-size:11px;color:var(--muted)}\n.empty{text-align:center;color:var(--muted);padding:26px 12px}.hidden{display:none!important}.foot{font-size:11px;color:var(--muted);line-height:1.7;margin:16px 3px}\n@media(max-width:420px){.grid{grid-template-columns:1fr}.searchrow select{width:112px}.stat{padding:9px 5px}}\n</style>\n</head>\n<body>\n<header><h1>🐎 リメッシの狙いたい馬一覧🐎</h1><p>気になる馬を記録して、次走で狙うタイミングを逃さない。</p></header>\n<main>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"totalCount\">0</b><span>登録馬</span></div>\n    <div class=\"stat\"><b id=\"watchCount\">0</b><span>次走チェック</span></div>\n    <div class=\"stat\"><b id=\"reviewCount\">0</b><span>振り返り済み</span></div>\n  </div>\n  <div class=\"tabs\">\n    <button class=\"tab active\" data-tab=\"list\" type=\"button\">馬リスト</button>\n    <button class=\"tab\" data-tab=\"form\" type=\"button\">馬を登録</button>\n    <button class=\"tab\" data-tab=\"backup\" type=\"button\">バックアップ</button>\n  </div>\n  <section id=\"listView\">\n    <div class=\"searchrow\">\n      <input id=\"search\" placeholder=\"馬名・条件で検索\">\n      <select id=\"filter\"><option value=\"all\">すべて</option><option value=\"watch\">次走チェック</option><option value=\"reviewed\">振り返り済み</option></select>\n    </div>\n    <div id=\"horseList\"></div>\n  </section>\n  <section id=\"formView\" class=\"panel hidden\">\n    <h2 id=\"formTitle\">馬を登録</h2>\n    <form id=\"horseForm\">\n      <input type=\"hidden\" id=\"horseId\">\n      <label for=\"name\">馬名 *</label><input id=\"name\" required maxlength=\"80\" placeholder=\"例：ウォーターリヒト\">\n      <div class=\"grid\">\n        <div><label for=\"race\">次走候補・レース</label><input id=\"race\" maxlength=\"100\" placeholder=\"例：富士ステークス\"></div>\n        <div><label for=\"status\">状態</label><select id=\"status\"><option value=\"次走チェック\">次走チェック</option><option value=\"条件待ち\">条件待ち</option><option value=\"振り返り済み\">振り返り済み</option><option value=\"保留\">保留</option></select></div>\n        <div><label for=\"distance\">狙いたい距離</label><input id=\"distance\" maxlength=\"60\" placeholder=\"例：芝1600m\"></div>\n        <div><label for=\"surface\">馬場・コース</label><input id=\"surface\" maxlength=\"80\" placeholder=\"例：良馬場、左回り\"></div>\n        <div><label for=\"pace\">展開・ペース</label><input id=\"pace\" maxlength=\"100\" placeholder=\"例：流れる展開が理想\"></div>\n        <div><label for=\"date\">登録日・確認日</label><input id=\"date\" type=\"date\"></div>\n      </div>\n      <label for=\"reason\">狙いたい理由</label><textarea id=\"reason\" maxlength=\"1500\" placeholder=\"前走で不利、距離短縮で狙いたい、など\"></textarea>\n      <label for=\"condition\">狙う条件・買い時</label><textarea id=\"condition\" maxlength=\"1500\" placeholder=\"条件が合えば狙いたい、展開・ペース次第、など\"></textarea>\n      <label for=\"review\">レース後の結果・反省</label><textarea id=\"review\" maxlength=\"1500\" placeholder=\"結果、予想と違った点、次に活かすこと\"></textarea>\n      <div class=\"actions\"><button class=\"btn primary\" type=\"submit\">保存する</button><button class=\"btn\" type=\"button\" id=\"cancelEdit\">キャンセル</button></div>\n    </form>\n  </section>\n  <section id=\"backupView\" class=\"panel hidden\">\n    <h2>データのバックアップ</h2>\n    <p style=\"font-size:13px;color:var(--muted)\">登録データは、このブラウザ内に保存されます。機種変更やブラウザのデータ消去に備えて、ときどきバックアップを保存してください。</p>\n    <div class=\"actions\"><button class=\"btn primary\" id=\"exportBtn\">バックアップを書き出す</button><button class=\"btn\" id=\"importBtn\">バックアップを読み込む</button><input class=\"hidden\" id=\"importFile\" type=\"file\" accept=\".json,application/json\"></div>\n    <p id=\"backupMessage\" class=\"meta\"></p>\n    <hr style=\"border:0;border-top:1px solid var(--line);margin:16px 0\">\n    <h2>データについて</h2>\n    <p style=\"font-size:13px;color:var(--muted)\">このアプリは外部サーバーにデータを送信しません。データはこのブラウザの保存領域に保管されます。同じURLでも、別の端末や別ブラウザとは自動同期されません。</p>\n    <button class=\"btn danger\" id=\"clearAll\">全データを削除</button>\n  </section>\n  <p class=\"foot\">※ このアプリは競馬メモ用です。出走予定や結果を自動取得する機能、通知機能はありません。レース情報は自分で更新してください。</p>\n</main>\n<script>\nconst KEY='nextStartHorseMemo_v1';\nconst initial=[{\n id:'water-rihito',name:'ウォーターリヒト',race:'富士ステークス',status:'条件待ち',\n distance:'',surface:'',pace:'展開・ペース次第',date:new Date().toISOString().slice(0,10),\n reason:'条件が合えば狙いたい',condition:'展開・ペース次第',review:''\n}];\nlet horses=[];\ntry{const saved=localStorage.getItem(KEY);horses=saved?JSON.parse(saved):initial; if(!Array.isArray(horses))horses=initial; horses=horses.map(h=>({...h,history:Array.isArray(h.history)?h.history:[]}));}catch(e){horses=initial;}\nconst $=id=>document.getElementById(id);\nfunction persist(){localStorage.setItem(KEY,JSON.stringify(horses));render();}\nfunction esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction render(){\n $('totalCount').textContent=horses.length;\n $('watchCount').textContent=horses.filter(h=>h.status==='次走チェック'||h.status==='条件待ち').length;\n $('reviewCount').textContent=horses.filter(h=>h.status==='振り返り済み').length;\n const q=$('search').value.trim().toLowerCase(), f=$('filter').value;\n const shown=horses.filter(h=>{\n  const blob=[h.name,h.race,h.reason,h.condition,h.distance,h.surface,h.pace,h.review,...(h.history||[]).flatMap(r=>[r.raceName,r.track,r.memo,r.finish,r.distance])].join(' ').toLowerCase();\n  return (!q||blob.includes(q))&&(f==='all'||(f==='watch'&&(h.status==='次走チェック'||h.status==='条件待ち'))||(f==='reviewed'&&h.status==='振り返り済み'));\n });\n $('horseList').innerHTML=shown.length?shown.map(h=>`<article class=\"horse\">\n  <div class=\"horse-top\"><div><h3>${esc(h.name)}</h3><span class=\"badge\">${esc(h.status||'次走チェック')}</span>${h.race?`<span class=\"badge\">${esc(h.race)}</span>`:''}</div></div>\n  <div class=\"meta\">${[h.distance,h.surface,h.pace].filter(Boolean).map(esc).join(' ・ ')||'距離・馬場・展開の条件は未設定'}${h.date?'　｜　確認日 '+esc(h.date):''}</div>\n  ${h.reason?`<p class=\"memo\"><b>狙いたい理由</b><br>${esc(h.reason)}</p>`:''}\n  ${h.condition?`<p class=\"memo\"><b>狙う条件</b><br>${esc(h.condition)}</p>`:''}\n  ${h.review?`<p class=\"memo\"><b>結果・反省</b><br>${esc(h.review)}</p>`:''}\n  <div class=\"history-head\"><h4>レース履歴（${(h.history||[]).length}走）</h4><button class=\"btn small primary\" onclick=\"showHistoryForm('${esc(h.id)}')\">＋ レースを追加</button></div>\n  <div id=\"historyForm-${esc(h.id)}\" class=\"history-form hidden\"></div>\n  ${(h.history||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10).map(r=>`<div class=\"race-item\">\n    <div class=\"race-title\">${esc(r.date||'日付未入力')}　${esc(r.raceName||'レース名未入力')}</div>\n    <div class=\"race-grid\">\n      <div class=\"race-stat\">競馬場：${esc(r.track||'—')}</div><div class=\"race-stat\">距離：${esc(r.distance||'—')}</div><div class=\"race-stat\">馬場：${esc(r.going||'—')}</div>\n      <div class=\"race-stat\">着順：${esc(r.finish||'—')}</div><div class=\"race-stat\">通過順：${esc(r.position||'—')}</div><div class=\"race-stat\">上がり3F：${esc(r.last3f||'—')}${r.last3f?'秒':''}</div>\n    </div>\n    ${r.memo?`<p class=\"race-memo\"><b>振り返り：</b>${esc(r.memo)}</p>`:''}\n    <div class=\"horse-actions\"><button class=\"btn small\" onclick=\"showHistoryForm('${esc(h.id)}','${esc(r.id)}')\">編集</button><button class=\"btn small danger\" onclick=\"deleteHistory('${esc(h.id)}','${esc(r.id)}')\">削除</button></div>\n  </div>`).join('')}\n  ${(h.history||[]).length>10?`<p class=\"tiny\">新しい順に10走を表示中（登録済み ${(h.history||[]).length}走）</p>`:''}\n  <div class=\"horse-actions\"><a class=\"btn small\" href=\"https://db.netkeiba.com/?pid=horse_list&amp;word=${encodeURIComponent(h.name||'')}\" target=\"_blank\" rel=\"noopener noreferrer\">netkeibaで馬情報を見る ↗</a><button class=\"btn small primary\" onclick=\"editHorse('${esc(h.id)}')\">馬メモを編集</button><button class=\"btn small\" onclick=\"quickReview('${esc(h.id)}')\">振り返り済みにする</button><button class=\"btn small danger\" onclick=\"deleteHorse('${esc(h.id)}')\">馬を削除</button></div>\n </article>`).join(''):'<div class=\"panel empty\">該当する馬がいません。<br>「馬を登録」から追加してみてな。</div>';\n}\nfunction showHistoryForm(horseId, raceId=''){\n const horse=horses.find(h=>h.id===horseId); if(!horse)return;\n if(!Array.isArray(horse.history))horse.history=[];\n const old=horse.history.find(r=>r.id===raceId)||{};\n const box=$('historyForm-'+horseId); if(!box)return;\n box.classList.remove('hidden');\n box.innerHTML=`<h4>${raceId?'レース履歴を編集':'レース履歴を追加'}</h4>\n <form onsubmit=\"saveHistory(event,'${esc(horseId)}','${esc(raceId)}')\">\n  <div class=\"grid\">\n   <div><label>日付</label><input name=\"date\" type=\"date\" value=\"${esc(old.date||'')}\" required></div>\n   <div><label>レース名</label><input name=\"raceName\" maxlength=\"100\" value=\"${esc(old.raceName||'')}\" placeholder=\"例：毎日王冠\" required></div>\n   <div><label>競馬場</label><select name=\"track\"><option value=\"\">選択してください</option>${['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉','海外','その他'].map(x=>`<option ${old.track===x?'selected':''}>${x}</option>`).join('')}</select></div>\n   <div><label>距離</label><input name=\"distance\" maxlength=\"30\" value=\"${esc(old.distance||'')}\" placeholder=\"芝1600m\"></div>\n   <div><label>馬場</label><select name=\"going\"><option value=\"\">未入力</option>${['良','稍重','重','不良','芝・良','芝・稍重','芝・重','芝・不良','ダート・良','ダート・稍重','ダート・重','ダート・不良'].map(x=>`<option ${old.going===x?'selected':''}>${x}</option>`).join('')}</select></div>\n   <div><label>着順</label><input name=\"finish\" maxlength=\"20\" value=\"${esc(old.finish||'')}\" placeholder=\"1着 / 5着 / 競走中止\"></div>\n   <div><label>通過順</label><input name=\"position\" maxlength=\"50\" value=\"${esc(old.position||'')}\" placeholder=\"3-3-4-5\"></div>\n   <div><label>上がり3F（秒）</label><input name=\"last3f\" inputmode=\"decimal\" maxlength=\"10\" value=\"${esc(old.last3f||'')}\" placeholder=\"34.2\"></div>\n  </div>\n  <label>振り返りメモ</label><textarea name=\"memo\" maxlength=\"3000\" placeholder=\"展開、不利、位置取り、次走で狙いたい条件など\">${esc(old.memo||'')}</textarea>\n  <div class=\"actions\"><button class=\"btn primary\" type=\"submit\">このレースを保存</button><button class=\"btn\" type=\"button\" onclick=\"hideHistoryForm('${esc(horseId)}')\">キャンセル</button></div>\n </form>`;\n box.scrollIntoView({behavior:'smooth',block:'nearest'});\n}\nwindow.showHistoryForm=showHistoryForm;\nwindow.hideHistoryForm=id=>{const box=$('historyForm-'+id);if(box){box.classList.add('hidden');box.innerHTML='';}};\nwindow.saveHistory=(event,horseId,raceId)=>{\n event.preventDefault();const horse=horses.find(h=>h.id===horseId);if(!horse)return;\n const form=event.target;const data=Object.fromEntries(new FormData(form).entries());\n if(!Array.isArray(horse.history))horse.history=[];\n const record={id:raceId||('r-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),...data};\n if(raceId){const i=horse.history.findIndex(r=>r.id===raceId);if(i>=0)horse.history[i]=record;else horse.history.push(record);}else horse.history.push(record);\n horse.history.sort((a,b)=>(b.date||'').localeCompare(a.date||''));persist();\n};\nwindow.deleteHistory=(horseId,raceId)=>{\n const horse=horses.find(h=>h.id===horseId);if(!horse)return;\n const record=(horse.history||[]).find(r=>r.id===raceId);if(record&&confirm('「'+(record.raceName||'このレース')+'」の履歴を削除する？')){horse.history=horse.history.filter(r=>r.id!==raceId);persist();}\n};\nfunction setTab(tab){\n document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));\n $('listView').classList.toggle('hidden',tab!=='list');$('formView').classList.toggle('hidden',tab!=='form');$('backupView').classList.toggle('hidden',tab!=='backup');\n}\nwindow.setTab=setTab;\nwindow.clearForm=clearForm;\n// タブ操作はインライン onclick に依存せず、イベントリスナーで処理する\n document.querySelectorAll('.tab[data-tab]').forEach(button=>{\n  button.addEventListener('click',()=>{\n   const tab=button.dataset.tab;\n   if(tab==='form') clearForm();\n   setTab(tab);\n  });\n });\nfunction clearForm(){\n $('horseForm').reset();$('horseId').value='';$('formTitle').textContent='馬を登録';$('date').value=new Date().toISOString().slice(0,10);\n}\nfunction editHorse(id){\n const h=horses.find(x=>x.id===id);if(!h)return;\n ['name','race','status','distance','surface','pace','date','reason','condition','review'].forEach(k=>$(k).value=h[k]||'');\n $('horseId').value=h.id;$('formTitle').textContent='馬メモを編集';setTab('form');window.scrollTo({top:0,behavior:'smooth'});\n}\nwindow.editHorse=editHorse;\nwindow.deleteHorse=id=>{const h=horses.find(x=>x.id===id);if(h&&confirm('「'+h.name+'」を削除する？')){horses=horses.filter(x=>x.id!==id);persist();}};\nwindow.quickReview=id=>{const h=horses.find(x=>x.id===id);if(h){h.status='振り返り済み';persist();}};\n$('horseForm').addEventListener('submit',e=>{\n e.preventDefault();const id=$('horseId').value;\n const old=id?horses.find(x=>x.id===id):null;const h={id:id||('h-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),history:old&&Array.isArray(old.history)?old.history:[]};\n ['name','race','status','distance','surface','pace','date','reason','condition','review'].forEach(k=>h[k]=$(k).value.trim());\n if(id){const i=horses.findIndex(x=>x.id===id);if(i>=0)horses[i]=h;else horses.unshift(h);}else horses.unshift(h);\n persist();clearForm();setTab('list');\n});\n$('cancelEdit').addEventListener('click',()=>{clearForm();setTab('list');});\n$('search').addEventListener('input',render);$('filter').addEventListener('change',render);\n$('exportBtn').addEventListener('click',()=>{\n const blob=new Blob([JSON.stringify(horses,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');\n a.href=url;a.download='リメッシの狙いたい馬一覧_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);$('backupMessage').textContent='バックアップを書き出しました。ファイルを大切に保管してな。';\n});\n$('importBtn').addEventListener('click',()=>$('importFile').click());\n$('importFile').addEventListener('change',async e=>{\n const file=e.target.files[0];if(!file)return;\n try{const parsed=JSON.parse(await file.text()); eld\"><label for=\"date\">日付</label><input id=\"date\" type=\"date\"></div>\n    <div class=\"field\"><label for=\"venue\">競馬場</label><select id=\"venue\"><option>東京</option><option>中山</option><option>京都</option><option>阪神</option><option>中京</option><option>新潟</option><option>福島</option><option>小倉</option><option>札幌</option><option>函館</option><option>大井</option><option>川崎</option><option>船橋</option><option>浦和</option><option>その他</option></select></div>\n    <div class=\"field\"><label for=\"surface\">馬場</label><select id=\"surface\"><option>芝</option><option>ダート</option></select></div>\n    <div class=\"field\"><label for=\"going\">馬場状態</label><select id=\"going\"><option>良</option><option>稍重</option><option>重</option><option>不良</option><option>未確認</option></select></div>\n    <div class=\"field\"><label for=\"course\">距離帯（任意）</label><select id=\"course\"><option value=\"all\">全距離</option><option>短距離</option><option>マイル</option><option>中距離</option><option>長距離</option></select></div>\n    <div class=\"field\"><label for=\"weather\">天候（任意）</label><select id=\"weather\"><option>未確認</option><option>晴</option><option>曇</option><option>雨</option><option>小雨</option><option>雪</option></select></div>\n  </div>\n  <p class=\"hint\">同じ日・同じ競馬場・同じ芝ダートを中心に集計。距離帯は必要に応じて絞り込めます。</p>\n</section>\n<section class=\"card\">\n  <h2>② レース結果を記録</h2>\n  <div class=\"formgrid\">\n    <div class=\"field\"><label for=\"race\">レース番号</label><input id=\"race\" placeholder=\"例：8R\" maxlength=\"8\"></div>\n    <div class=\"field\"><label for=\"distance\">距離（m）</label><input id=\"distance\" type=\"number\" min=\"800\" max=\"4000\" step=\"100\" placeholder=\"例：1600\"></div>\n    <div class=\"field\"><label for=\"pace\">ペース</label><select id=\"pace\"><option>未分類</option><option>スロー</option><option>平均</option><option>ハイ</option></select></div>\n    <div class=\"field\"><label for=\"front\">前の馬の残り方</label><select id=\"front\"><option>未分類</option><option>前残り</option><option>前崩れ</option><option>混在</option></select></div>\n    <div class=\"field\"><label for=\"firststyle\">1着馬の脚質</label><select id=\"firststyle\"><option>逃げ</option><option>先行</option><option>差し</option><option>追込</option></select></div>\n    <div class=\"field\"><label for=\"firstlane\">1着馬の進路</label><select id=\"firstlane\"><option>内</option><option>中</option><option>外</option><option>不明</option></select></div>\n    <div class=\"field\"><label for=\"secondstyle\">2着馬の脚質</label><select id=\"secondstyle\"><option>不明</option><option>逃げ</option><option>先行</option><option>差し</option><option>追込</option></select></div>\n    <div class=\"field\"><label for=\"secondlane\">2着馬の進路</label><select id=\"secondlane\"><option>不明</option><option>内</option><option>中</option><option>外</option></select></div>\n    <div class=\"field\"><label for=\"thirdstyle\">3着馬の脚質</label><select id=\"thirdstyle\"><option>不明</option><option>逃げ</option><option>先行</option><option>差し</option><option>追込</option></select></div>\n    <div class=\"field\"><label for=\"thirdlane\">3着馬の進路</label><select id=\"thirdlane\"><option>不明</option><option>内</option><option>中</option><option>外</option></select></div>\n    <div class=\"field span2\">\n      <div class=\"sectionhead\"><label style=\"margin:0\">4着以下の馬（複数追加可）</label><button type=\"button\" class=\"btn\" id=\"addRunner\">＋ 馬を追加</button></div>\n      <div class=\"hint\">4着以下は、着順・脚質・通った進路を入力。馬名は任意です。</div>\n      <div id=\"runnerRows\"></div>\n    </div>\n    <div class=\"field span2\"><label for=\"memo\">メモ（任意）</label><textarea id=\"memo\" placeholder=\"例：直線は外へ出した馬が伸びていた\"></textarea></div>\n    <div class=\"field span2\"><label for=\"netkeibaUrl\">netkeiba レース結果URL（任意）</label><input id=\"netkeibaUrl\" type=\"url\" placeholder=\"https://race.netkeiba.com/race/result.html?...\"><span class=\"hint\">リンクを保存して、あとからレース結果を確認できます。URL先のデータを自動取得する機能ではありません。</span></div>\n  </div>\n  <div class=\"btns\"><button class=\"btn primary\" id=\"saveRace\">レースを保存</button><button class=\"btn\" id=\"sample\">サンプルを入れる</button><button class=\"btn ghost\" id=\"resetForm\">入力をクリア</button></div>\n</section>\n<section class=\"card full\">\n  <div class=\"sectionhead\"><h2>③ 今日の傾向サマリー</h2><span id=\"confidence\" class=\"badge warn\">データ不足</span></div>\n  <p class=\"hint\">以下は記録されたレースの集計です。好走率ではなく、上位入線馬に占める構成比も含むため、因果関係を断定しません。</p>\n  <div class=\"stats\" style=\"margin:14px 0 18px\">\n    <div class=\"stat\"><small>記録レース</small><strong id=\"nRaces\">0</strong></div>\n    <div class=\"stat\"><small>上位3頭データ</small><strong id=\"nTop\">0</strong></div>\n    <div class=\"stat\"><small>前残りレース</small><strong id=\"nFront\">0</strong></div>\n    <div class=\"stat\"><small>差し・追込の割合</small><strong id=\"nClosers\">—</strong></div>\n  </div>\n  <div class=\"formgrid\">\n    <div><h3 style=\"font-size:15px\">脚質（上位3頭の構成比）</h3><div id=\"styleBars\"></div></div>\n    <div><h3 style=\"font-size:15px\">進路（上位3頭の構成比）</h3><div id=\"laneBars\"></div></div>\n  </div>\n  <h3 style=\"font-size:15px;margin-top:22px\">脚質別の出走数・3着以内率</h3>\n  <div class=\"tablewrap\"><table><thead><tr><th>脚質</th><th>出走数</th><th>3着以内</th><th>3着以内率</th></tr></thead><tbody id=\"styleRates\"></tbody></table></div>\n  <h3 style=\"font-size:15px;margin-top:22px\">進路別の出走数・3着以内率</h3>\n  <div class=\"tablewrap\"><table><thead><tr><th>進路</th><th>出走数</th><th>3着以内</th><th>3着以内率</th></tr></thead><tbody id=\"laneRates\"></tbody></table></div>\n  <div class=\"notice\" id=\"interpretation\" style=\"margin-bottom:0\">まずはレース結果を2〜3件記録してみよう。</div>\n</section>\n<section class=\"card full\">\n  <div class=\"sectionhead\"><h2>④ 登録した穴馬候補との照合</h2><span class=\"badge\">簡易ルール・試作</span></div>\n  <p class=\"hint\">候補馬の脚質と想定進路を登録すると、当日の傾向との一致を説明します。これは予想の補助であり、勝率予測ではありません。</p>\n  <div class=\"formgrid\">\n    <div class=\"field\"><label for=\"horse\">馬名</label><input id=\"horse\" placeholder=\"例：サンプルホース\"></div>\n    <div class=\"field\"><label for=\"horseStyle\">脚質</label><select id=\"horseStyle\"><option>逃げ</option><option>先行</option><option>差し</option><option>追込</option><option>不明</option></select></div>\n    <div class=\"field\"><label for=\"horseLane\">想定進路</label><select id=\"horseLane\"><option>内</option><option>中</option><option>外</option><option>不明</option></select></div>\n    <div class=\"field\"><label for=\"horseNote\">狙いたい理由</label><input id=\"horseNote\" placeholder=\"例：前走で展開が不向き\"></div>\n  </div>\n  <div class=\"btns\"><button class=\"btn primary\" id=\"saveHorse\">候補馬を登録</button><button class=\"btn\" id=\"sampleHorse\">候補馬サンプル</button></div>\n  <div id=\"candidateList\" style=\"margin-top:12px\"><div class=\"empty\">候補馬はまだ登録されていません。</div></div>\n</section>\n<section class=\"card full\">\n  <div class=\"sectionhead\"><h2>⑤ 記録したレース</h2><div class=\"btns\" style=\"margin:0\"><button class=\"btn\" id=\"export\">CSVを書き出す</button><button class=\"btn danger\" id=\"clear\">全データ削除</button></div></div>\n  <div class=\"tablewrap\"><table><thead><tr><th>日付</th><th>競馬場</th><th>馬場</th><th>距離</th><th>ペース</th><th>1着脚質</th><th>1着進路</th><th>2着脚質</th><th>2着進路</th><th>3着脚質</th><th>3着進路</th><th>4着以下</th><th>メモ</th><th>結果URL</th><th>操作</th></tr></thead><tbody id=\"raceRows\"></tbody></table></div>\n  <div id=\"emptyRaces\" class=\"empty\">まだレース記録がありません。</div>\n</section>\n</div>\n<div class=\"footer\">デモ版 v0.1 · データはこのブラウザの localStorage に保存 · 外部データの自動取得なし · 共有データベースなし</div>\n</div>\n<script>\nconst $=id=>document.getElementById(id);\nconst STORE='kyou_no_baba_demo_v1';\nlet races=[], horses=[]; let extraRunnerDraftId=0;\nconst today=new Date(); $('date').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;\nfunction persist(){localStorage.setItem(STORE,JSON.stringify({races,horses}));}\nfunction load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');races=Array.isArray(x.races)?x.races:[];horses=Array.isArray(x.horses)?x.horses:[]}catch(e){races=[];horses=[]}}\nfunction csvCell(v){return '\"'+String(v??'').replaceAll('\"','\"\"')+'\"'}\nfunction download(name,content,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}\nfunction tokenize(s){return String(s||'').split(/[、,，\\s]+/).map(x=>x.trim()).filter(Boolean)}\nfunction currentRaces(){return races.filter(r=>r.date===$('date').value&&r.venue===$('venue').value&&r.surface===$('surface').value&&($('course').value==='all'||r.band===$('course').value))}\nfunction addRunnerRow(data={}) {\n  const host=$('runnerRows'); const index=host.children.length+4; const row=document.createElement('div');\n  row.className='runner-row'; row.dataset.runnerId=String(++extraRunnerDraftId);\n  const place=document.createElement('div'); place.className='field'; place.innerHTML=`<label>着順</label><input class=\"runner-place\" type=\"number\" min=\"4\" step=\"1\" value=\"${data.place||index}\" aria-label=\"着順\">`;\n  const style=document.createElement('div'); style.className='field'; style.innerHTML='<label>脚質</label><select class=\"runner-style\"><option>不明</option><option>逃げ</option><option>先行</option><option>差し</option><option>追込</option></select>'; style.querySelector('select').value=data.style||'不明';\n  const lane=document.createElement('div'); lane.className='field'; lane.innerHTML='<label>進路</label><select class=\"runner-lane\"><option>不明</option><option>内</option><option>中</option><option>外</option></select>'; lane.querySelector('select').value=data.lane||'不明';\n  const remove=document.createElement('button'); remove.type='button'; remove.className='btn danger remove-runner'; remove.textContent='×'; remove.title='この馬を削除'; remove.onclick=()=>row.remove();\n  row.append(place,style,lane,remove); host.appendChild(row);\n}\nfunction readExtraRunners(){return [...$('runnerRows').querySelectorAll('.runner-row')].map(row=>({place:Number(row.querySelector('.runner-place').value),style:row.querySelector('.runner-style').value,lane:row.querySelector('.runner-lane').value})).filter(r=>r.place>=4&&Number.isFinite(r.place));}\nfunction allRunners(r){const list=[\n {place:1,style:r.firststyle,lane:r.firstlane},\n {place:2,style:r.secondstyle||'不明',lane:r.secondlane||'不明'},\n {place:3,style:r.thirdstyle||'不明',lane:r.thirdlane||'不明'},\n ...(Array.isArray(r.extraRunners)?r.extraRunners:[])\n]; return list.filter(x=>x.style&&x.style!=='不明'&&Number.isFinite(Number(x.place)));}\nfunction ratesBy(key,data){const result={};data.forEach(r=>allRunners(r).forEach(h=>{const k=h[key];if(!k||k==='不明')return;if(!result[k])result[k]={starts:0,placed:0};result[k].starts++;if(Number(h.place)<=3)result[k].placed++;}));return result;}\nfunction renderRates(id,stats,order){const body=$(id);body.innerHTML='';const keys=[...order,...Object.keys(stats).filter(k=>!order.includes(k))];keys.forEach(k=>{const v=stats[k];if(!v)return;const tr=document.createElement('tr');[k,v.starts,v.placed,Math.round(v.placed/v.starts*100)+'%'].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.appendChild(td)});body.appendChild(tr)});if(!body.children.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.textContent='集計できるデータがありません（脚質・進路を入力してください）';td.className='empty';tr.appendChild(td);body.appendChild(tr)}}\nfunction makeSample(){const d=$('date').value,v=$('venue').value,s=$('surface').value,g=$('going').value;const examples=[['5R',1400,'平均','混在','差し','外','先行、差し、差し','中、外、外','直線で外から伸びる馬が目立つ'],['7R',1600,'ハイ','前崩れ','差し','中','差し、追込、先行','外、中、内','前半が流れて差しが届いた'],['9R',1800,'スロー','前残り','先行','内','逃げ、先行、差し','内、中、内','スローで前が止まらなかった']];examples.forEach((e,i)=>races.push({id:crypto.randomUUID(),date:d,venue:v,surface:s,going:g,band:e[1]<=1400?'短距離':e[1]<=1600?'マイル':e[1]<=2200?'中距離':'長距離',race:e[0],distance:e[1],pace:e[2],front:e[3],firststyle:e[4],firstlane:e[5],secondstyle:tokenize(e[6])[1]||'不明',secondlane:tokenize(e[7])[1]||'不明',thirdstyle:tokenize(e[6])[2]||'不明',thirdlane:tokenize(e[7])[2]||'不明',topstyles:e[6],toplanes:e[7],extraRunners:[{place:4,style:'先行',lane:'内'},{place:5,style:'逃げ',lane:'内'},{place:6,style:'先行',lane:'中'}],memo:e[8],netkeibaUrl:''}));persist();render()}\nfunction saveRace(){const distance=Number($('distance').value);if(!distance){alert('距離（m）を入力してな');return}const band=distance<=1400?'短距離':distance<=1600?'マイル':distance<=2200?'中距離':'長距離';races.push({id:crypto.randomUUID(),date:$('date').value,venue:$('venue').value,surface:$('surface').value,going:$('going').value,band,race:$('race').value||'—',distance,pace:$('pace').value,front:$('front').value,firststyle:$('firststyle').value,firstlane:$('firstlane').value,secondstyle:$('secondstyle').value,secondlane:$('secondlane').value,thirdstyle:$('thirdstyle').value,thirdlane:$('thirdlane').value,topstyles:[$('firststyle').value,$('secondstyle').value,$('thirdstyle').value].filter(x=>x!=='不明').join('、'),toplanes:[$('firstlane').value,$('secondlane').value,$('thirdlane').value].filter(x=>x!=='不明').join('、'),extraRunners:readExtraRunners(),memo:$('memo').value,netkeibaUrl:$('netkeibaUrl').value.trim()});persist();render();alert('レースを保存したで！')}\nfunction renderBars(target,counts,total,labels){const el=$(target);el.innerHTML='';labels.forEach(label=>{const n=counts[label]||0,p=total?Math.round(n/total*100):0;const row=document.createElement('div');row.className='barrow';row.innerHTML=`<span>${label}</span><div class=\"track\"><div class=\"fill\" style=\"width:${p}%\"></div></div><b>${total?p+'%':'—'}</b>`;el.appendChild(row)})}\nfunction render(){const data=currentRaces();$('nRaces').textContent=data.length;let styles={逃げ:0,先行:0,差し:0,追込:0},lanes={内:0,中:0,外:0};let topCount=0,front=0,closers=0;data.forEach(r=>{tokenize(r.topstyles || [r.firststyle,r.secondstyle,r.thirdstyle].filter(x=>x&&x!=='不明').join('、')).forEach(x=>{if(x==='追い込み')x='追込';if(styles[x]!==undefined){styles[x]++;topCount++;if(x==='差し'||x==='追込')closers++}});tokenize(r.toplanes || [r.firstlane,r.secondlane,r.thirdlane].filter(x=>x&&x!=='不明').join('、')).forEach(x=>{if(lanes[x]!==undefined)lanes[x]++});if(r.front==='前残り')front++});$('nTop').textContent=topCount;$('nFront').textContent=front;$('nClosers').textContent=topCount?Math.round(closers/topCount*100)+'%':'—';renderBars('styleBars',styles,topCount,['逃げ','先行','差し','追込']);const laneCount=Object.values(lanes).reduce((a,b)=>a+b,0);renderBars('laneBars',lanes,laneCount,['内','中','外']);renderRates('styleRates',ratesBy('style',data),['逃げ','先行','差し','追込']);renderRates('laneRates',ratesBy('lane',data),['内','中','外']);const conf=$('confidence'),interp=$('interpretation');if(data.length<3){conf.className='badge warn';conf.textContent='データ不足';interp.textContent=`記録は${data.length}レース。3レース未満のため傾向は判断保留。サンプル数が増えるほど参考にしやすくなります。`}else{conf.className='badge good';conf.textContent='集計あり';const topStyle=Object.entries(styles).sort((a,b)=>b[1]-a[1])[0],topLane=Object.entries(lanes).sort((a,b)=>b[1]-a[1])[0];interp.textContent=`上位馬の脚質構成では「${topStyle[0]}」、進路構成では「${topLane[0]}」が最多です。ただし、出走馬全体のデータではないため、有利と断定せず、ペース・枠順・距離も合わせて確認してください。`}renderHorses(data,styles,topCount,lanes,laneCount);renderRows()}\nfunction renderHorses(data,styles,stotal,lanes,ltotal){const el=$('candidateList');el.innerHTML='';if(!horses.length){el.innerHTML='<div class=\"empty\">候補馬はまだ登録されていません。</div>';return}horses.forEach(h=>{let score=0,reasons=[];if(stotal&&h.style!=='不明'){const p=(styles[h.style]||0)/stotal;if(p>=.3){score++;reasons.push(`${h.style}タイプが上位馬に多い`)}else reasons.push(`${h.style}タイプの上位馬構成比は高くない`)}if(ltotal&&h.lane!=='不明'){const p=(lanes[h.lane]||0)/ltotal;if(p>=.35){score++;reasons.push(`${h.lane}を通った上位馬が多い`)}else reasons.push(`${h.lane}の上位馬構成比は高くない`)}const div=document.createElement('div');div.className='candidate';const left=document.createElement('div');const strong=document.createElement('strong');strong.textContent=h.name;const p=document.createElement('p');p.textContent=`${h.style}・想定${h.lane}／${h.note||'理由メモなし'}${reasons.length?'。'+reasons.join('。'): '。比較データ不足'}`;left.append(strong,p);const right=document.createElement('div');right.className='score';right.textContent=reasons.length?`${score}/${reasons.length} 条件一致`:'判定保留';const del=document.createElement('button');del.className='btn ghost';del.textContent='削除';del.style.marginTop='6px';del.onclick=()=>{horses=horses.filter(x=>x.id!==h.id);persist();render()};right.appendChild(del);div.append(left,right);el.appendChild(div)})}\nfunction renderRows(){const body=$('raceRows');body.innerHTML='';const list=[...races].sort((a,b)=>(b.date+b.race).localeCompare(a.date+a.race));$('emptyRaces').style.display=list.length?'none':'block';list.forEach(r=>{const tr=document.createElement('tr');const labels=['日付','競馬場','馬場','距離','ペース','1着脚質','1着進路','2着脚質','2着進路','3着脚質','3着進路','4着以下','メモ'];[r.date,r.venue,`${r.surface}・${r.going}`,r.distance+'m',r.pace,r.firststyle,r.firstlane,r.secondstyle||'—',r.secondlane||'—',r.thirdstyle||'—',r.thirdlane||'—',(r.extraRunners||[]).length,r.memo||'—'].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;td.setAttribute('data-label',labels[i]);if(i===12)td.className='note';tr.appendChild(td)});const linkTd=document.createElement('td');linkTd.setAttribute('data-label','結果URL');if(r.netkeibaUrl){const a=document.createElement('a');a.href=r.netkeibaUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='結果を見る';a.style.color='var(--blue)';linkTd.appendChild(a)}else{linkTd.textContent='—'}tr.appendChild(linkTd);const td=document.createElement('td');td.setAttribute('data-label','操作');const btn=document.createElement('button');btn.className='btn danger';btn.textContent='削除';btn.onclick=()=>{races=races.filter(x=>x.id!==r.id);persist();render()};td.appendChild(btn);tr.appendChild(td);body.appendChild(tr)})}\nfunction saveHorse(){const name=$('horse').value.trim();if(!name){alert('馬名を入力してな');return}horses.push({id:crypto.randomUUID(),name,style:$('horseStyle').value,lane:$('horseLane').value,note:$('horseNote').value});persist();render();$('horse').value= function showApp(name){
  const appHtml = apps[name];
  if (!appHtml) { frame.srcdoc = '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:16px sans-serif;padding:20px">アプリを読み込めませんでした。ページを再読み込みしてください。</body>'; return; }
  frame.onload = function(){};
  frame.removeAttribute('src');
  frame.srcdoc = appHtml;
  document.querySelectorAll('[data-view]').forEach(b=>{
    const on=b.dataset.view===name;
    b.classList.toggle('active',on);
    b.setAttribute('aria-pressed',String(on));
  });
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showApp(b.dataset.view)));
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',()=>showApp('horse'),{once:true});
else showApp('horse');
</script></body></html>
